# Daily: when White Wallet has a newer release than white-wallet.version, open (or refresh) a pull request that moves
# to it, with the new version and a CHANGELOG.md section. Merging it releases (release.yml).
name: Update White Wallet

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  update:
    # Until the GitHub App is set up (README.md, "Set up once"), there's nothing to open pull requests with.
    if: vars.UPDATE_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The pull request must come from an app, not GITHUB_TOKEN: pull requests opened with that don't run CI.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.UPDATE_APP_ID }}
          private-key: ${{ secrets.UPDATE_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
      - name: Latest White Wallet release
        id: latest
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          pinned="$(tr -d '[:space:]' < white-wallet.version)"
          # Pinned to White Wallet's main between releases (README.md): only a release after the one the app's last
          # release was built from ends it.
          if [[ "$pinned" != v* ]]; then
            released="v$(grep -E '^app.version.name=' brand.properties | cut -d= -f2- | tr -d ' ')"
            git fetch -q --depth=1 origin tag "$released"
            pinned="$(git show "$released:white-wallet.version" | tr -d '[:space:]')"
          fi
          tag="$(gh release view -R zapofnakamoto/white-wallet --json tagName --jq .tagName)"
          if [[ "$tag" == "$pinned" || "$(printf '%s\n%s\n' "$pinned" "$tag" | sort -V | tail -1)" != "$tag" ]]; then
            echo "Up to date at $pinned (latest release: $tag)."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            gh release view -R zapofnakamoto/white-wallet "$tag" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          fi
      - name: Open the pull request
        if: steps.latest.outputs.tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          # The app's own semver: a White Wallet patch raises the patch, anything bigger the minor. 1.0.0 is decided
          # by hand (README.md, "Updates and releases").
          IFS=. read -r major minor patch <<< "$(grep -E '^app.version.name=' brand.properties | cut -d= -f2- | tr -d ' ')"
          # Pinned to White Wallet's main between releases: no old version to compare, so the minor goes up.
          IFS=. read -r old_major old_minor _ <<< "$(tr -d '[:space:]v' < white-wallet.version)"
          IFS=. read -r new_major new_minor _ <<< "${TAG#v}"
          if [[ "$old_major.$old_minor" == "$new_major.$new_minor" ]]; then
            name="$major.$minor.$((patch + 1))"
          else
            name="$major.$((minor + 1)).0"
          fi
          code=$(( $(grep -E '^app.version.code=' brand.properties | cut -d= -f2- | tr -d ' ') + 1 ))
          # Two commits: the move to White Wallet, then the release (app.version.code, app.version.name, CHANGELOG.md section).
          git config user.name "zap-of-nakamoto-bot"
          git config user.email "zap-of-nakamoto-bot@users.noreply.github.com"
          git switch -C update/white-wallet
          echo "$TAG" > white-wallet.version
          git commit -qam "chore(deps): white-wallet $TAG"
          sed -i -E "s/^app.version.code=.*/app.version.code=$code/; s/^app.version.name=.*/app.version.name=$name/" brand.properties
          # The new section takes over what ## [Unreleased] holds, White Wallet's release notes after it; Unreleased
          # stays, empty.
          printf '## [%s]\n\nOn White Wallet %s.\n' "$name" "$TAG" > "$RUNNER_TEMP/head.md"
          awk -v head="$RUNNER_TEMP/head.md" -v notes="$RUNNER_TEMP/notes.md" '
            function put(f,  l) { while ((getline l < f) > 0) print l; close(f) }
            state == 1 && /^## \[/ { put(notes); print ""; state = 2 }
            { print }
            state == 0 && /^## \[Unreleased\]/ { print ""; put(head); state = 1 }
            END { if (state == 1) put(notes); if (!state) { print "CHANGELOG.md has no ## [Unreleased]" > "/dev/stderr"; exit 1 } }
          ' CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          mv "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md

          git commit -qam "chore(release): v$name"
          git push -f origin update/white-wallet
          body="$(printf 'Moves to White Wallet %s and releases %s (app.version.code %s) when merged.\n\n%s' "$TAG" "$name" "$code" "$(cat "$RUNNER_TEMP/notes.md")")"
          if gh pr view update/white-wallet --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit update/white-wallet --title "White Wallet $TAG" --body "$body"
          else
            gh pr create --head update/white-wallet --title "White Wallet $TAG" --body "$body"
          fi
