# Every push to main whose v<versionName> isn't released yet: build and sign the APK, check its certificate, and
# create the GitHub release with the APK and its checksum. Zapstore's catalog indexes new apps from these releases.
# With the repository variable ZAPSTORE_PUBLISH=true, the release is also published to Zapstore with zsp; running the
# workflow by hand then publishes the current version even if its GitHub release exists already. A push whose
# versionName is released already does nothing. When the release job fails (the bunker offline, say), re-run that
# job. Setup: README.md, "Set up once".
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ZSP_VERSION: v0.5.11

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: .github/scripts/version-check.sh
      - id: v
        run: |
          name="$(grep -E '^versionName=' brand.properties | cut -d= -f2- | tr -d ' ')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if ! git rev-parse -q --verify "refs/tags/v$name" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "${{ vars.ZAPSTORE_PUBLISH }}" == true ]]; then
            echo "v$name is on GitHub already; publishing it to Zapstore."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$name is released already; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: zapstore
    permissions:
      contents: write
    env:
      NAME: ${{ needs.plan.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: brand
      - name: Pinned White Wallet
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < brand/white-wallet.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zapofnakamoto/white-wallet
          ref: ${{ steps.pin.outputs.ref }}
          path: white-wallet
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ZAP_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed release APK
        working-directory: white-wallet
        env:
          WW_KEYSTORE: ${{ runner.temp }}/release.jks
          WW_KEYSTORE_PASSWORD: ${{ secrets.ZAP_KEYSTORE_PASSWORD }}
          WW_KEY_ALIAS: ${{ secrets.ZAP_KEY_ALIAS }}
          WW_KEY_PASSWORD: ${{ secrets.ZAP_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PbrandDir="$GITHUB_WORKSPACE/brand"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the certificate
        env:
          EXPECTED: ${{ vars.ZAP_CERT_SHA256 }}
        run: |
          set -o pipefail
          apk=white-wallet/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          echo "Using $apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          actual="$(sed -n '/certificate SHA-256 digest: /{s/.*digest: //p;q}' "$RUNNER_TEMP/certs.txt")"
          expected="$(echo "$EXPECTED" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$expected" && "$actual" == "$expected" ]] || { echo "Signed with $actual, expected ${expected:-<ZAP_CERT_SHA256 unset>}." >&2; exit 1; }
          mkdir -p out
          cp "$apk" "out/zap-of-nakamoto-$NAME.apk"
          (cd out && sha256sum "zap-of-nakamoto-$NAME.apk" > "zap-of-nakamoto-$NAME.apk.sha256")

      - name: GitHub release
        working-directory: brand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## [$NAME]" 'index($0, v) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # Already there when a failed run is run again; the build is reproducible, so its APK is this one.
          gh release view "v$NAME" >/dev/null 2>&1 ||
            gh release create "v$NAME" ../out/* --target "$GITHUB_SHA" --title "Zap of Nakamoto $NAME" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Zapstore publishing off
        if: vars.ZAPSTORE_PUBLISH != 'true'
        run: |
          echo "::notice::Not published to Zapstore: the repository variable ZAPSTORE_PUBLISH isn't true yet (README.md, \"First release\")."
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: vars.ZAPSTORE_PUBLISH == 'true'
        with:
          go-version: stable
      - name: Publish to Zapstore
        if: vars.ZAPSTORE_PUBLISH == 'true'
        working-directory: brand
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_BUNKER }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go install "github.com/zapstore/zsp/cmd/zsp@$ZSP_VERSION"
          zsp publish --check zapstore.yaml
          zsp publish --quiet --skip-preview zapstore.yaml
