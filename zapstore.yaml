# Zapstore listing for Zap of Nakamoto, read by zsp (https://github.com/zapstore/zsp), at the repository root where
# Zapstore looks for it. .github/workflows/release.yml creates the GitHub release; Zapstore picks up each new one,
# signed by the publisher npub1k98clftxkp4tmce4wp7evmczymhl0cqly2qgjwshdv3uxj73d8ysv04zap through its proof.
repository: https://github.com/zapofnakamoto/zap-of-nakamoto
match: ^zap-of-nakamoto-.*\.apk$
release_notes: ./CHANGELOG.md
name: Zap of Nakamoto
summary: Just zap it
description: |
  The simplest way to send and receive bitcoin over Lightning. Pick a name, get your Lightning address, and you're
  ready: no setup, no settings to learn.

  - Your own Lightning address that receives even while your phone is off
  - Pay any Lightning invoice or address by scanning a QR code
  - A recovery phrase that stays on your phone

  Your bitcoin is kept by a Lightning service (mint.lnurlcash.com), like cash in your pocket: keep amounts small.

  Beta until version 1.0.0: not ready for everyday money yet. Any update may change how the app works or break
  what it did before, and bugs can cost you what's in the wallet. Use it only to try it out, with tiny amounts you
  could lose without minding.
tags:
  - bitcoin
  - lightning
  - wallet
license: MIT
website: https://github.com/zapofnakamoto/zap-of-nakamoto
icon: ./zapstore/profile.png
images:
  - ./zapstore/1-setup.png
  - ./zapstore/2-wallet.png
  - ./zapstore/3-receive.png
  - ./zapstore/4-send.png
metadata_sources: [github]
