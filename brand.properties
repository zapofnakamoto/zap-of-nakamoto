# Zap of Nakamoto, the flagship brand: the simplest wallet this project makes, for people who only want to send and
# receive. One mint, one account, one address, one note per mint, and nothing to manage by hand. See README.md
# for the product rules, and White Wallet's docs/WHITE_LABEL.md (at the tag in white-wallet.version) for every key.

# The app
app.name=Zap of Nakamoto
# Final since the first release: never change it, or users get a new app instead of an update.
app.id=io.github.zapofnakamoto
# app.version.name is the app's own semver (README.md, "Updates and releases"), whatever White Wallet's version is;
# 1.0.0 ends the beta. app.version.code goes up by one with every release. Raising app.version.name is what releases
# (README.md).
app.version.code=3
app.version.name=0.3.0
# Beta until 1.0.0: shown at setup and in About (White Wallet v0.3.0 and later), in Zap's words (release_notice_beta).
app.releaseStage=beta
app.supportUrl=https://mint.lnurlcash.com

# Mints
# The LNURLcash mint preselected during onboarding (host, optionally with :port).
mints.default=mint.lnurlcash.com
# Mints offered in the onboarding dropdown (comma-separated; the default is always included). Users can also pick
# "Custom".
mints.suggestions=
# true: setup and restore show a mint picker (the default preselected, plus "Custom…"), users can add an address on
# another mint in Settings, and change their home mint on its page.
mints.changeable=true
# true shows Settings → Mints, the home mint's page (where users can change it, with mints.changeable), and
# which mint a claimed note is on and whether it's trusted. false hides all of that.
mints.visible=true
# Mints shown as trusted from the start, each as host:pubkey (the mint's signing key), comma-separated. Users can
# untrust them; each account's home mint is trusted by default anyway. Empty: the one home mint is the trusted one.
mints.trusted=

# Accounts and Lightning Addresses
# Accounts the app holds (1 hides everything about accounts) and Lightning Addresses an account may register per
# mint. 0 means no limit.
accounts.max=1
addresses.max=1
# Lightning Addresses at setup: required = setup asks for a name, optional = it asks but users may continue without
# one, none = setup only creates the account (a single button when mints.changeable=false). Without an address,
# users receive by invoice and can still get one later in Settings.
addresses.lightning=optional

# Amounts
# How amounts are shown until the user picks a unit in Settings: bitcoin (BIP-177: ₿1,000) or sats (1,000 sats).
amounts.unit.default=bitcoin
# Whether users may switch the unit under Settings → Amounts. With false, amounts always show in
# amounts.unit.default.
amounts.unit.changeable=false

# Notes
# Where users manage their notes (share, split, combine, recheck, renew): tab = a Notes tab next to Wallet and
# History, settings = a page under Settings → Account, hidden = nowhere (the note strategy keeps them by itself).
notes.view=tab
# Note strategies users can choose from, in this order (built in: single, manual; a code/ module can add its own),
# and the one a new account starts with.
notes.strategies=single
notes.strategy.default=single
# "Collect at home mint": notes on other mints are moved to the account's home mint automatically, when the move
# costs at most notes.collect.feeCap percent. hidden = not offered, off = offered and starts off, on = offered and
# starts on, always = every account collects and users have no switch.
notes.collect.atHomeMint=always
notes.collect.feeCap=2
# A short message when the wallet changed the zaps by itself (combined, renewed, moved home), with what that did to
# the balance: always, without a switch, so Note settings stay away (nothing else to choose there).
notes.maintenance.notices=always

# History
# Filters on the History tab: none = no filters, and note maintenance (the single strategy's renewing and
# combining) stays hidden, as there is nothing about notes to manage.
history.filter=none

# Developer options in Settings: shown = always, unlock = hidden until the version in About is tapped seven times,
# hidden = never in release builds (debug builds treat hidden as unlock).
developer.options=hidden
