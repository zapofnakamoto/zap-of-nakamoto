# Zap of Nakamoto, the flagship brand: the simplest wallet this project makes, for people who only want to send and
# receive. One service, one account, one address, one note per service, and nothing to manage by hand. See README.md
# for the product rules, and White Wallet's docs/WHITE_LABEL.md (at the tag in white-wallet.version) for every key.
appName=Zap of Nakamoto
# Final since the first release: never change it, or users get a new app instead of an update.
applicationId=io.github.zapofnakamoto
# versionName is the White Wallet version in white-wallet.version (plus .1, .2, … for a brand-only release);
# versionCode goes up by one with every release. CI refuses a change that ships without both.
versionCode=3
versionName=0.3.0
# The LNURLcash mint preselected during onboarding (host, optionally with :port).
defaultServiceHost=mint.lnurlcash.com
# Mints offered in the onboarding dropdown (comma-separated; the default is always included). Users can also pick "Custom".
serviceSuggestions=
# true: setup and restore show a service picker (the default preselected, plus "Custom…"), and users can add an
# address on another service in Settings.
allowServiceChange=true
# How amounts are shown until the user picks a unit in Settings: bitcoin (BIP-177: ₿1,000) or sats (1,000 sats).
defaultAmountUnit=bitcoin
# Whether users may switch the unit under Settings → Amounts. With false, amounts always show in defaultAmountUnit.
allowUnitChange=false
# Whether every account needs a Lightning Address. With false, setup only creates the account (a single button when
# allowServiceChange=false); users receive by invoice and can still get an address later in Settings.
requireAddress=true
# Accounts the app holds (1 hides everything about accounts) and Lightning Addresses an account may register per
# mint. 0 means no limit.
maxAccounts=1
maxAddresses=1
# Note strategies users can choose from, in this order (built in: single, manual; a code/ module can add its own),
# and the one a new account starts with.
noteStrategies=single
defaultNoteStrategy=single
# "Collect at home mint": notes on other mints are moved to the account's home mint automatically, when the move
# costs at most collectFeeCap percent. hidden = not offered, off = offered and starts off, on = offered and starts on,
# always = every account collects and users have no switch.
collectAtHomeMint=always
collectFeeCap=2
# Where users manage their notes (share, split, combine, recheck, renew): tab = a Notes tab next to Wallet and
# History, settings = a page under Settings → Account, hidden = nowhere (the note strategy keeps them by itself).
notesView=hidden
# true shows Settings → Services, the home service's page (where users can change it, with allowServiceChange), and
# which service a claimed note is on and whether it's trusted. false hides all of that.
showMints=true
# Developer options in Settings: shown = always, unlock = hidden until the version in About is tapped seven times,
# hidden = never in release builds (debug builds treat hidden as unlock).
developerOptions=hidden
# Beta until we decide otherwise, whatever the version: shown at setup and in About (White Wallet v0.3.0 and later).
releaseStage=beta
# Mints shown as trusted from the start, each as host:pubkey (the mint's signing key), comma-separated. Users can
# untrust them; each account's home mint is trusted by default anyway. Empty: the one home mint is the trusted one.
trustedMints=
supportUrl=https://mint.lnurlcash.com
